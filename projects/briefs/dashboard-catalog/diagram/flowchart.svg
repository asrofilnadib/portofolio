<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 1040" width="100%" role="img" aria-label="Dashboard Catalog flowchart">
  <defs>
    <marker id="arrow-catalog" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c9c9c9"/>
    </marker>
  </defs>
  <style>
    .box { fill: #1f2020; stroke: #ccc; stroke-width: 1.5; }
    .decision { fill: #1f2020; stroke: #ccc; stroke-width: 1.5; }
    .label { fill: #e8e8e8; font-family: "Trebuchet MS", Verdana, Arial, sans-serif; font-size: 15px; text-anchor: middle; }
    .sub { font-size: 13px; }
    .edge { stroke: #c9c9c9; stroke-width: 1.5; fill: none; marker-end: url(#arrow-catalog); }
    .edge-label { fill: #b0b0b0; font-family: "Trebuchet MS", Verdana, Arial, sans-serif; font-size: 12px; text-anchor: middle; }
  </style>

  <rect class="box" x="70" y="24" width="420" height="48" rx="8"/>
  <text class="label" x="280" y="53">Buka /data-analyst/dashboard-catalog</text>
  <path class="edge" d="M280 72 V100"/>

  <rect class="box" x="110" y="100" width="340" height="56" rx="8"/>
  <text class="label" x="280" y="124">Cek permission halaman</text>
  <text class="label sub" x="280" y="142">dashboard_catalog</text>
  <path class="edge" d="M280 156 V184"/>

  <rect class="box" x="70" y="184" width="420" height="64" rx="8"/>
  <text class="label" x="280" y="212">Pilih section</text>
  <text class="label sub" x="280" y="232">Production / QC / Warehouse</text>
  <path class="edge" d="M280 248 V276"/>

  <polygon class="decision" points="280,276 390,336 280,396 170,336"/>
  <text class="label" x="280" y="332">Editor?</text>
  <text class="label sub" x="280" y="350">dashboard_catalog_da</text>
  <text class="edge-label" x="130" y="336">Tidak</text>
  <text class="edge-label" x="430" y="336">Ya</text>

  <path class="edge" d="M170 336 H70 V470"/>
  <rect class="box" x="8" y="470" width="150" height="72" rx="8"/>
  <text class="label" x="83" y="498" style="font-size:13px">Lihat matriks</text>
  <text class="label sub" x="83" y="518">plant x grup</text>

  <path class="edge" d="M390 336 H500 V430"/>
  <rect class="box" x="400" y="430" width="150" height="88" rx="8"/>
  <text class="label" x="475" y="458" style="font-size:13px">Edit grup</text>
  <text class="label sub" x="475" y="476">item, KPI</text>
  <text class="label sub" x="475" y="494">kredensial</text>

  <path class="edge" d="M83 542 V600 H280"/>
  <path class="edge" d="M475 518 V600 H280"/>

  <rect class="box" x="90" y="612" width="380" height="64" rx="8"/>
  <text class="label" x="280" y="640">Klik cell</text>
  <text class="label sub" x="280" y="660">iframe Metabase, signed embed</text>
  <path class="edge" d="M280 676 V704"/>

  <rect class="box" x="70" y="704" width="420" height="72" rx="8"/>
  <text class="label" x="280" y="732">Tab IP Address (editor)</text>
  <text class="label sub" x="280" y="752">host, tabel, sheet</text>
  <path class="edge" d="M280 776 V804"/>

  <rect class="box" x="90" y="804" width="380" height="64" rx="8"/>
  <text class="label" x="280" y="832">Kredensial terenkripsi</text>
  <text class="label sub" x="280" y="852">reveal / peek, bukan field terbuka</text>
</svg>
