<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 980" width="100%" role="img" aria-label="Dashboard Yield flowchart">
  <defs>
    <marker id="arrow-yield" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c9c9c9"/>
    </marker>
  </defs>
  <style>
    .box { fill: #1f2020; stroke: #ccc; stroke-width: 1.5; }
    .label { fill: #e8e8e8; font-family: "Trebuchet MS", Verdana, Arial, sans-serif; font-size: 15px; text-anchor: middle; }
    .sub { font-size: 13px; }
    .edge { stroke: #c9c9c9; stroke-width: 1.5; fill: none; marker-end: url(#arrow-yield); }
  </style>

  <rect class="box" x="130" y="24" width="300" height="48" rx="8"/>
  <text class="label" x="280" y="53">Buka /seas2/dashboard-yield</text>
  <path class="edge" d="M280 72 V100"/>

  <rect class="box" x="120" y="100" width="320" height="56" rx="8"/>
  <text class="label" x="280" y="124">Cek akses Seasoning 2</text>
  <text class="label sub" x="280" y="142">portal auth yang sudah ada</text>
  <path class="edge" d="M280 156 V184"/>

  <rect class="box" x="90" y="184" width="380" height="64" rx="8"/>
  <text class="label" x="280" y="212">Resolve window shift berjalan</text>
  <text class="label sub" x="280" y="232">1: 07-15 / 2: 15-23 / 3: 23-07 WIB</text>
  <path class="edge" d="M280 248 V276"/>

  <rect class="box" x="80" y="276" width="400" height="64" rx="8"/>
  <text class="label" x="280" y="304">Baca counter PCS, SLOC E003</text>
  <text class="label sub" x="280" y="324">koneksi control_line_prs2</text>
  <path class="edge" d="M280 340 V368"/>

  <rect class="box" x="70" y="368" width="420" height="64" rx="8"/>
  <text class="label" x="280" y="396">Map workcenter ke line</text>
  <text class="label sub" x="280" y="416">hitung menit OFF per mesin</text>
  <path class="edge" d="M280 432 V460"/>

  <rect class="box" x="90" y="460" width="380" height="64" rx="8"/>
  <text class="label" x="280" y="488">Cache 30 detik per slot</text>
  <text class="label sub" x="280" y="508">slot tampilan tiap 30 menit</text>
  <path class="edge" d="M280 524 V552"/>

  <rect class="box" x="80" y="552" width="400" height="64" rx="8"/>
  <text class="label" x="280" y="580">Board kartu per line</text>
  <text class="label sub" x="280" y="600">ON / OFF / no production</text>
  <path class="edge" d="M280 616 V644"/>

  <rect class="box" x="90" y="644" width="380" height="64" rx="8"/>
  <text class="label" x="280" y="672">Pareto per shift</text>
  <text class="label sub" x="280" y="692">filter rentang tanggal</text>
  <path class="edge" d="M280 708 V736"/>

  <rect class="box" x="140" y="736" width="280" height="48" rx="8"/>
  <text class="label" x="280" y="765">Mode TV / fullscreen</text>
</svg>
