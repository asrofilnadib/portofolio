<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1380" width="100%" role="img" aria-label="Logbook Magang data flow diagram">
  <defs>
    <marker id="lb-d-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c9c9c9"/>
    </marker>
  </defs>
  <style>
    .band { fill: #17171b; stroke: #333; stroke-width: 1; }
    .ent { fill: #1f2020; stroke: #8750f7; stroke-width: 1.6; }
    .proc { fill: #1f2020; stroke: #ccc; stroke-width: 1.5; }
    .store { fill: #16161a; stroke: #aaa; stroke-width: 1.5; }
    .label { fill: #e8e8e8; font-family: "Trebuchet MS", Verdana, Arial, sans-serif; font-size: 13px; text-anchor: middle; }
    .sub { font-size: 11px; fill: #c9c9c9; }
    .flow { stroke: #c9c9c9; stroke-width: 1.6; fill: none; marker-end: url(#lb-d-arrow); }
    .seq { stroke: #8750f7; stroke-width: 1.6; fill: none; marker-end: url(#lb-d-arrow); }
    .flab { fill: #b8b8b8; font-family: "Trebuchet MS", Verdana, Arial, sans-serif; font-size: 11px; text-anchor: middle; }
    .title { fill: #f0e6ff; font-family: "Trebuchet MS", Verdana, Arial, sans-serif; font-size: 16px; font-weight: 700; text-anchor: middle; }
    .col { fill: #8a8a8a; font-family: "Trebuchet MS", Verdana, Arial, sans-serif; font-size: 11px; text-anchor: middle; letter-spacing: 0.4px; }
  </style>

  <text class="title" x="640" y="28">DFD Magang / PKL — satu baris = satu proses</text>
  <text class="col" x="116" y="52">AKTOR</text>
  <text class="col" x="500" y="52">PROSES</text>
  <text class="col" x="1020" y="52">DATA STORE</text>

  <!-- row bands -->
  <rect class="band" x="16" y="64" width="1248" height="176" rx="8"/>
  <rect class="band" x="16" y="252" width="1248" height="176" rx="8"/>
  <rect class="band" x="16" y="440" width="1248" height="196" rx="8"/>
  <rect class="band" x="16" y="648" width="1248" height="176" rx="8"/>
  <rect class="band" x="16" y="836" width="1248" height="176" rx="8"/>
  <rect class="band" x="16" y="1024" width="1248" height="176" rx="8"/>

  <!-- ===== ROW 1 Isi Logbook ===== -->
  <rect class="ent" x="32" y="118" width="168" height="52" rx="4"/>
  <text class="label" x="116" y="149">Intern</text>
  <path class="flow" d="M200 144 H370"/>
  <text class="flab" x="285" y="134">kegiatan, leave, pulsa</text>

  <ellipse class="proc" cx="500" cy="144" rx="128" ry="40"/>
  <text class="label" x="500" y="138">1 Isi Logbook</text>
  <text class="sub" x="500" y="156">kegiatan / leave / pulsa</text>

  <path class="flow" d="M628 144 H800"/>
  <rect class="store" x="800" y="86" width="440" height="48"/>
  <line x1="812" y1="86" x2="812" y2="134" stroke="#aaa" stroke-width="3"/>
  <text class="label" x="1020" y="116">t_magang_logbook</text>
  <rect class="store" x="800" y="148" width="440" height="48"/>
  <line x1="812" y1="148" x2="812" y2="196" stroke="#aaa" stroke-width="3"/>
  <text class="label" x="1020" y="178">t_magang_master</text>
  <text class="sub" x="1020" y="210">NIK, jenis, SPV, join / end</text>

  <!-- seq 1 to 2 -->
  <path class="seq" d="M500 184 V252"/>
  <text class="flab" x="548" y="226">lanjut merge</text>

  <!-- ===== ROW 2 Merge Absensi ===== -->
  <rect class="ent" x="32" y="306" width="168" height="56" rx="4"/>
  <text class="label" x="116" y="328">Absensi Server</text>
  <text class="sub" x="116" y="346">device taps</text>
  <path class="flow" d="M200 334 H370"/>
  <text class="flab" x="285" y="324">clock taps</text>

  <ellipse class="proc" cx="500" cy="334" rx="128" ry="40"/>
  <text class="label" x="500" y="328">2 Merge Absensi</text>
  <text class="sub" x="500" y="346">shift + t_absensi</text>

  <path class="flow" d="M628 334 H800"/>
  <rect class="store" x="800" y="274" width="440" height="52"/>
  <line x1="812" y1="274" x2="812" y2="326" stroke="#aaa" stroke-width="3"/>
  <text class="label" x="1020" y="296">t_absensi</text>
  <text class="sub" x="1020" y="312">absensi_server (juta row)</text>
  <rect class="store" x="800" y="338" width="440" height="48"/>
  <line x1="812" y1="338" x2="812" y2="386" stroke="#aaa" stroke-width="3"/>
  <text class="label" x="1020" y="368">hari_libur</text>

  <path class="seq" d="M500 374 V440"/>
  <text class="flab" x="555" y="414">hari kerja</text>

  <!-- ===== ROW 3 Approval ===== -->
  <rect class="ent" x="32" y="468" width="168" height="48" rx="4"/>
  <text class="label" x="116" y="497">SPV</text>
  <path class="flow" d="M200 492 H370"/>
  <text class="flab" x="285" y="482">paraf + approve leave</text>

  <rect class="ent" x="32" y="532" width="168" height="48" rx="4"/>
  <text class="label" x="116" y="561">Manager</text>
  <path class="flow" d="M200 556 H370"/>
  <text class="flab" x="285" y="546">TTD periode</text>

  <ellipse class="proc" cx="500" cy="524" rx="128" ry="44"/>
  <text class="label" x="500" y="518">3 Approval Periode</text>
  <text class="sub" x="500" y="536">paraf SPV lalu Manager</text>

  <path class="flow" d="M628 524 H800"/>
  <rect class="store" x="800" y="498" width="440" height="52"/>
  <line x1="812" y1="498" x2="812" y2="550" stroke="#aaa" stroke-width="3"/>
  <text class="label" x="1020" y="520">periode_approval</text>
  <text class="sub" x="1020" y="536">SPV / Manager TTD</text>

  <path class="seq" d="M500 568 V648"/>
  <text class="flab" x="555" y="616">siap clip</text>

  <!-- ===== ROW 4 Clip ===== -->
  <rect class="ent" x="32" y="706" width="168" height="52" rx="4"/>
  <text class="label" x="116" y="737">System</text>
  <path class="flow" d="M200 732 H370"/>
  <text class="flab" x="285" y="722">join / end vs 21-20</text>

  <ellipse class="proc" cx="500" cy="732" rx="128" ry="40"/>
  <text class="label" x="500" y="726">4 Clip Join / End</text>
  <text class="sub" x="500" y="744">overlap vs periode 21-20</text>

  <path class="flow" d="M628 732 H800"/>
  <rect class="store" x="800" y="688" width="440" height="48"/>
  <line x1="812" y1="688" x2="812" y2="736" stroke="#aaa" stroke-width="3"/>
  <text class="label" x="1020" y="718">t_magang_master</text>
  <rect class="store" x="800" y="748" width="440" height="48"/>
  <line x1="812" y1="748" x2="812" y2="796" stroke="#aaa" stroke-width="3"/>
  <text class="label" x="1020" y="778">t_magang_logbook</text>
  <text class="sub" x="1020" y="812">contoh clip: join 5 Jul / finish 16 Agu</text>

  <path class="seq" d="M500 772 V836"/>
  <text class="flab" x="560" y="812">jumlah hari</text>

  <!-- ===== ROW 5 Claim ===== -->
  <rect class="ent" x="32" y="890" width="168" height="52" rx="4"/>
  <text class="label" x="116" y="921">Admin PIC</text>
  <path class="flow" d="M200 916 H370"/>
  <text class="flab" x="285" y="906">generate claim</text>

  <ellipse class="proc" cx="500" cy="916" rx="128" ry="40"/>
  <text class="label" x="500" y="910">5 Claim Uang Saku</text>
  <text class="sub" x="500" y="928">tarif Magang vs PKL</text>

  <path class="flow" d="M628 916 H800"/>
  <rect class="store" x="800" y="858" width="440" height="48"/>
  <line x1="812" y1="858" x2="812" y2="906" stroke="#aaa" stroke-width="3"/>
  <text class="label" x="1020" y="888">t_magang_claim</text>
  <rect class="store" x="800" y="918" width="440" height="48"/>
  <line x1="812" y1="918" x2="812" y2="966" stroke="#aaa" stroke-width="3"/>
  <text class="label" x="1020" y="948">t_magang_claim_pulsa</text>

  <path class="seq" d="M500 956 V1024"/>
  <text class="flab" x="575" y="998">periode + jumlah hari</text>

  <!-- ===== ROW 6 Export ===== -->
  <rect class="ent" x="32" y="1078" width="168" height="52" rx="4"/>
  <text class="label" x="116" y="1109">Intern / PIC</text>
  <path class="flow" d="M200 1104 H370"/>
  <text class="flab" x="285" y="1094">print / unduh</text>

  <ellipse class="proc" cx="500" cy="1104" rx="128" ry="40"/>
  <text class="label" x="500" y="1098">6 Export</text>
  <text class="sub" x="500" y="1116">Excel / PDF / Print</text>

  <path class="flow" d="M628 1104 H800"/>
  <rect class="store" x="800" y="1060" width="440" height="48"/>
  <line x1="812" y1="1060" x2="812" y2="1108" stroke="#aaa" stroke-width="3"/>
  <text class="label" x="1020" y="1090">t_magang_logbook</text>
  <rect class="store" x="800" y="1120" width="440" height="48"/>
  <line x1="812" y1="1120" x2="812" y2="1168" stroke="#aaa" stroke-width="3"/>
  <text class="label" x="1020" y="1150">t_magang_claim</text>
  <text class="sub" x="1020" y="1182">label periode sudah ter-clip</text>

  <!-- legend -->
  <rect class="ent" x="32" y="1232" width="24" height="18" rx="2"/>
  <text class="sub" x="132" y="1246">external entity</text>
  <ellipse class="proc" cx="280" cy="1241" rx="18" ry="12"/>
  <text class="sub" x="360" y="1246">process</text>
  <rect class="store" x="430" y="1232" width="36" height="18"/>
  <line x1="436" y1="1232" x2="436" y2="1250" stroke="#aaa" stroke-width="2"/>
  <text class="sub" x="530" y="1246">data store</text>
  <path class="seq" d="M640 1241 H700"/>
  <text class="sub" x="790" y="1246">ungu = urutan proses</text>
  <text class="sub" x="1060" y="1246">Store boleh diulang biar panah pendek</text>

  <text class="sub" x="640" y="1290">SPV paraf dulu, baru Manager TTD. Clip memotong export dan uang saku ke overlap join/end vs 21-20.</text>
</svg>
