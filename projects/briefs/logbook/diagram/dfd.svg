<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 1180" width="100%" role="img" aria-label="DFD Level 1 Logbook Magang Gane-Sarson">
  <defs>
    <marker id="lb-gs-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e6e6e6"/>
    </marker>
  </defs>
  <style>
    .ent { fill: #2c3340; stroke: #e6e6e6; stroke-width: 1.6; }
    .proc { fill: #3a4556; stroke: #e6e6e6; stroke-width: 1.8; }
    .store-line { stroke: #e6e6e6; stroke-width: 1.4; fill: none; }
    .elab { fill: #f0f0f0; font-family: Georgia, "Times New Roman", serif; font-size: 13px; text-anchor: middle; }
    .pnum { fill: #f0f0f0; font-family: Georgia, "Times New Roman", serif; font-size: 13px; text-anchor: middle; }
    .plab { fill: #f0f0f0; font-family: Georgia, "Times New Roman", serif; font-size: 11px; text-anchor: middle; }
    .slab { fill: #f0f0f0; font-family: Georgia, "Times New Roman", serif; font-size: 12px; text-anchor: middle; }
    .flab { fill: #cfcfcf; font-family: Georgia, "Times New Roman", serif; font-size: 11px; }
    .title { fill: #f0f0f0; font-family: Georgia, "Times New Roman", serif; font-size: 15px; text-anchor: middle; }
    .flow { stroke: #e6e6e6; stroke-width: 1.2; fill: none; marker-end: url(#lb-gs-arrow); }
    .wire { stroke: #e6e6e6; stroke-width: 1.2; fill: none; }
  </style>

  <text class="title" x="460" y="24">DFD Level 1 — Logbook Magang / PKL</text>

  <!-- entities -->
  <rect class="ent" x="24" y="44" width="150" height="40"/>
  <text class="elab" x="99" y="69">Intern</text>

  <rect class="ent" x="730" y="44" width="160" height="48"/>
  <text class="elab" x="810" y="64">Absensi Server</text>
  <text class="plab" x="810" y="80">device taps</text>

  <rect class="ent" x="24" y="448" width="150" height="36"/>
  <text class="elab" x="99" y="471">SPV</text>

  <rect class="ent" x="24" y="500" width="150" height="36"/>
  <text class="elab" x="99" y="523">Manager</text>

  <rect class="ent" x="730" y="788" width="160" height="40"/>
  <text class="elab" x="810" y="813">Admin PIC</text>

  <!-- processes 1.0 - 6.0 -->
  <circle class="proc" cx="280" cy="140" r="54"/>
  <text class="pnum" x="280" y="128">1.0</text>
  <text class="plab" x="280" y="146">Isi Logbook</text>
  <text class="plab" x="280" y="160">kegiatan / leave</text>

  <circle class="proc" cx="280" cy="310" r="54"/>
  <text class="pnum" x="280" y="298">2.0</text>
  <text class="plab" x="280" y="316">Merge Absensi</text>
  <text class="plab" x="280" y="330">shift + taps</text>

  <circle class="proc" cx="280" cy="480" r="54"/>
  <text class="pnum" x="280" y="468">3.0</text>
  <text class="plab" x="280" y="486">Approval</text>
  <text class="plab" x="280" y="500">Periode</text>

  <circle class="proc" cx="280" cy="650" r="54"/>
  <text class="pnum" x="280" y="638">4.0</text>
  <text class="plab" x="280" y="656">Clip Join / End</text>
  <text class="plab" x="280" y="670">vs 21-20</text>

  <circle class="proc" cx="280" cy="820" r="54"/>
  <text class="pnum" x="280" y="808">5.0</text>
  <text class="plab" x="280" y="826">Claim</text>
  <text class="plab" x="280" y="840">Uang Saku</text>

  <circle class="proc" cx="280" cy="990" r="54"/>
  <text class="pnum" x="280" y="978">6.0</text>
  <text class="plab" x="280" y="996">Export</text>
  <text class="plab" x="280" y="1010">Excel / PDF</text>

  <!-- data stores: two parallel lines -->
  <line class="store-line" x1="500" y1="118" x2="720" y2="118"/>
  <line class="store-line" x1="500" y1="146" x2="720" y2="146"/>
  <text class="slab" x="610" y="138">t_magang_logbook</text>

  <line class="store-line" x1="500" y1="168" x2="720" y2="168"/>
  <line class="store-line" x1="500" y1="196" x2="720" y2="196"/>
  <text class="slab" x="610" y="188">t_magang_master</text>

  <line class="store-line" x1="500" y1="288" x2="720" y2="288"/>
  <line class="store-line" x1="500" y1="316" x2="720" y2="316"/>
  <text class="slab" x="610" y="308">t_absensi</text>

  <line class="store-line" x1="500" y1="338" x2="720" y2="338"/>
  <line class="store-line" x1="500" y1="366" x2="720" y2="366"/>
  <text class="slab" x="610" y="358">hari_libur</text>

  <line class="store-line" x1="500" y1="458" x2="720" y2="458"/>
  <line class="store-line" x1="500" y1="486" x2="720" y2="486"/>
  <text class="slab" x="610" y="478">periode_approval</text>

  <line class="store-line" x1="500" y1="798" x2="720" y2="798"/>
  <line class="store-line" x1="500" y1="826" x2="720" y2="826"/>
  <text class="slab" x="610" y="818">t_magang_claim</text>

  <line class="store-line" x1="500" y1="848" x2="720" y2="848"/>
  <line class="store-line" x1="500" y1="876" x2="720" y2="876"/>
  <text class="slab" x="610" y="868">t_magang_claim_pulsa</text>

  <!-- intern to 1.0 -->
  <path class="flow" d="M174 64 H220 V140 H226"/>
  <text class="flab" x="178" y="102">kegiatan, leave, pulsa</text>

  <!-- absensi to 2.0 -->
  <path class="flow" d="M730 68 H680 V310 H334"/>
  <text class="flab" x="686" y="200">clock taps</text>

  <!-- 1.0 to stores -->
  <path class="flow" d="M334 132 H500"/>
  <text class="flab" x="360" y="124">isi harian</text>
  <path class="flow" d="M334 150 H460 V182 H500"/>
  <text class="flab" x="360" y="168">profil intern</text>

  <!-- 1.0 to 2.0 -->
  <path class="flow" d="M280 194 V256"/>
  <text class="flab" x="288" y="230">logbook</text>

  <!-- 2.0 to stores -->
  <path class="flow" d="M334 302 H500"/>
  <text class="flab" x="368" y="294">merge taps</text>
  <path class="flow" d="M334 318 H460 V352 H500"/>
  <text class="flab" x="368" y="338">libur / cuti</text>

  <!-- 2.0 to 3.0 -->
  <path class="flow" d="M280 364 V426"/>
  <text class="flab" x="288" y="400">hari kerja</text>

  <!-- SPV / Manager to 3.0 -->
  <path class="flow" d="M174 466 H226"/>
  <text class="flab" x="176" y="458">paraf + leave</text>
  <path class="flow" d="M174 518 H200 V490 H226"/>
  <text class="flab" x="176" y="540">TTD periode</text>

  <!-- 3.0 to approval store -->
  <path class="flow" d="M334 480 H500"/>
  <text class="flab" x="360" y="472">SPV / Mgr TTD</text>

  <!-- 3.0 to 4.0 -->
  <path class="flow" d="M280 534 V596"/>
  <text class="flab" x="288" y="570">periode signed</text>

  <!-- 4.0 reads master + logbook via gutter -->
  <path class="flow" d="M334 640 H450 V182 H500"/>
  <text class="flab" x="338" y="620">join / end date</text>
  <path class="wire" d="M334 662 H470"/>
  <text class="flab" x="338" y="680">hari logbook</text>

  <!-- logbook store bus (1.0, 4.0, 6.0) -->
  <path class="wire" d="M470 132 V978"/>
  <path class="flow" d="M470 132 H500"/>

  <!-- 4.0 to 5.0 -->
  <path class="flow" d="M280 704 V766"/>
  <text class="flab" x="288" y="740">jumlah hari</text>

  <!-- PIC to 5.0 -->
  <path class="flow" d="M730 808 H680 V820 H334"/>
  <text class="flab" x="640" y="800">generate claim</text>

  <!-- 5.0 to claim stores -->
  <path class="flow" d="M334 812 H500"/>
  <text class="flab" x="360" y="804">uang saku</text>
  <path class="flow" d="M334 832 H460 V862 H500"/>
  <text class="flab" x="360" y="850">claim pulsa</text>

  <!-- 5.0 to 6.0 -->
  <path class="flow" d="M280 874 V936"/>
  <text class="flab" x="288" y="910">periode clipped</text>

  <!-- 6.0 reads logbook + claim -->
  <path class="wire" d="M334 978 H470"/>
  <text class="flab" x="400" y="960">isi export</text>
  <path class="flow" d="M334 1002 H450 V812 H500"/>
  <text class="flab" x="400" y="1040">claim export</text>

  <!-- 6.0 back to Intern -->
  <path class="flow" d="M226 1010 H8 V64 H24"/>
  <text class="flab" x="12" y="540">PDF / Excel</text>
</svg>
