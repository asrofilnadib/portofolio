<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1760" width="100%" role="img" aria-label="TMS data flow diagram">
  <defs>
    <marker id="tms-d-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c9c9c9"/>
    </marker>
  </defs>
  <style>
    .band { fill: #17171b; stroke: #333; stroke-width: 1; }
    .ent { fill: #1f2020; stroke: #8750f7; stroke-width: 1.6; }
    .proc { fill: #1f2020; stroke: #ccc; stroke-width: 1.5; }
    .store { fill: #16161a; stroke: #aaa; stroke-width: 1.5; }
    .label { fill: #e8e8e8; font-family: "Trebuchet MS", Verdana, Arial, sans-serif; font-size: 13px; text-anchor: middle; }
    .sub { font-size: 11px; fill: #c9c9c9; }
    .flow { stroke: #c9c9c9; stroke-width: 1.6; fill: none; marker-end: url(#tms-d-arrow); }
    .seq { stroke: #8750f7; stroke-width: 1.6; fill: none; marker-end: url(#tms-d-arrow); }
    .flab { fill: #b8b8b8; font-family: "Trebuchet MS", Verdana, Arial, sans-serif; font-size: 11px; text-anchor: middle; }
    .title { fill: #f0e6ff; font-family: "Trebuchet MS", Verdana, Arial, sans-serif; font-size: 16px; font-weight: 700; text-anchor: middle; }
    .col { fill: #8a8a8a; font-family: "Trebuchet MS", Verdana, Arial, sans-serif; font-size: 11px; text-anchor: middle; letter-spacing: 0.4px; }
  </style>

  <text class="title" x="640" y="28">DFD TMS — satu baris = satu proses</text>
  <text class="col" x="116" y="52">AKTOR</text>
  <text class="col" x="500" y="52">PROSES</text>
  <text class="col" x="1020" y="52">DATA STORE</text>

  <rect class="band" x="16" y="64" width="1248" height="176" rx="8"/>
  <rect class="band" x="16" y="252" width="1248" height="176" rx="8"/>
  <rect class="band" x="16" y="440" width="1248" height="176" rx="8"/>
  <rect class="band" x="16" y="628" width="1248" height="176" rx="8"/>
  <rect class="band" x="16" y="816" width="1248" height="176" rx="8"/>
  <rect class="band" x="16" y="1004" width="1248" height="196" rx="8"/>
  <rect class="band" x="16" y="1212" width="1248" height="176" rx="8"/>
  <rect class="band" x="16" y="1400" width="1248" height="196" rx="8"/>

  <!-- ===== 1 Upload Reservasi ===== -->
  <rect class="ent" x="32" y="86" width="168" height="48" rx="4"/>
  <text class="label" x="116" y="115">SAP</text>
  <path class="flow" d="M200 110 H370"/>
  <text class="flab" x="285" y="100">Excel RSV</text>

  <rect class="ent" x="32" y="150" width="168" height="48" rx="4"/>
  <text class="label" x="116" y="179">Produksi</text>
  <path class="flow" d="M200 174 H370"/>
  <text class="flab" x="285" y="164">upload file</text>

  <ellipse class="proc" cx="500" cy="142" rx="128" ry="42"/>
  <text class="label" x="500" y="136">1 Upload Reservasi</text>
  <text class="sub" x="500" y="154">Excel SAP / RSV</text>

  <path class="flow" d="M628 142 H800"/>
  <rect class="store" x="800" y="118" width="440" height="48"/>
  <line x1="812" y1="118" x2="812" y2="166" stroke="#aaa" stroke-width="3"/>
  <text class="label" x="1020" y="148">tms_material_reservasi</text>

  <path class="seq" d="M500 184 V252"/>
  <text class="flab" x="548" y="226">lanjut picking</text>

  <!-- ===== 2 Picking WSM ===== -->
  <rect class="ent" x="32" y="306" width="168" height="52" rx="4"/>
  <text class="label" x="116" y="337">Admin WSM</text>
  <path class="flow" d="M200 332 H370"/>
  <text class="flab" x="285" y="322">picking list</text>

  <ellipse class="proc" cx="500" cy="332" rx="128" ry="40"/>
  <text class="label" x="500" y="326">2 Picking WSM</text>
  <text class="sub" x="500" y="344">MID + palet</text>

  <path class="flow" d="M628 332 H800"/>
  <rect class="store" x="800" y="274" width="440" height="52"/>
  <line x1="812" y1="274" x2="812" y2="326" stroke="#aaa" stroke-width="3"/>
  <text class="label" x="1020" y="296">tms_material_reservasi_wsm</text>
  <text class="sub" x="1020" y="312">picking / MID</text>
  <rect class="store" x="800" y="338" width="440" height="48"/>
  <line x1="812" y1="338" x2="812" y2="386" stroke="#aaa" stroke-width="3"/>
  <text class="label" x="1020" y="368">tms_master_konversi_palet</text>

  <path class="seq" d="M500 372 V440"/>
  <text class="flab" x="548" y="414">gate staging</text>

  <!-- ===== 3 Staging Confirm ===== -->
  <rect class="ent" x="32" y="494" width="168" height="52" rx="4"/>
  <text class="label" x="116" y="525">Staging</text>
  <path class="flow" d="M200 520 H370"/>
  <text class="flab" x="285" y="510">checklist</text>

  <ellipse class="proc" cx="500" cy="520" rx="128" ry="40"/>
  <text class="label" x="500" y="514">3 Staging Confirm</text>
  <text class="sub" x="500" y="532">material = aktif</text>

  <path class="flow" d="M628 520 H800"/>
  <rect class="store" x="800" y="494" width="440" height="52"/>
  <line x1="812" y1="494" x2="812" y2="546" stroke="#aaa" stroke-width="3"/>
  <text class="label" x="1020" y="516">merge tables</text>
  <text class="sub" x="1020" y="532">RSV + WSM aktif</text>

  <path class="seq" d="M500 560 V628"/>
  <text class="flab" x="555" y="602">siap request</text>

  <!-- ===== 4 Draft / Request ===== -->
  <rect class="ent" x="32" y="682" width="168" height="52" rx="4"/>
  <text class="label" x="116" y="713">Pengawas</text>
  <path class="flow" d="M200 708 H370"/>
  <text class="flab" x="285" y="698">draft SJ max 12 palet</text>

  <ellipse class="proc" cx="500" cy="708" rx="128" ry="40"/>
  <text class="label" x="500" y="702">4 Draft / Request</text>
  <text class="sub" x="500" y="720">SJ to / to_2 / to_3</text>

  <path class="flow" d="M628 708 H800"/>
  <rect class="store" x="800" y="682" width="440" height="52"/>
  <line x1="812" y1="682" x2="812" y2="734" stroke="#aaa" stroke-width="3"/>
  <text class="label" x="1020" y="704">tms_transaction</text>
  <text class="sub" x="1020" y="720">status = request</text>

  <path class="seq" d="M500 748 V816"/>
  <text class="flab" x="555" y="790">broadcast driver</text>

  <!-- ===== 5 Race Accept ===== -->
  <rect class="ent" x="32" y="870" width="168" height="52" rx="4"/>
  <text class="label" x="116" y="901">Driver</text>
  <path class="flow" d="M200 896 H370"/>
  <text class="flab" x="285" y="886">accept / reject</text>

  <ellipse class="proc" cx="500" cy="896" rx="128" ry="40"/>
  <text class="label" x="500" y="890">5 Race Accept</text>
  <text class="sub" x="500" y="908">SJ jadi DO</text>

  <path class="flow" d="M628 896 H800"/>
  <rect class="store" x="800" y="838" width="440" height="52"/>
  <line x1="812" y1="838" x2="812" y2="890" stroke="#aaa" stroke-width="3"/>
  <text class="label" x="1020" y="860">tms_driver / tms_car</text>
  <text class="sub" x="1020" y="876">harus QR gedung aktif</text>
  <rect class="store" x="800" y="902" width="440" height="48"/>
  <line x1="812" y1="902" x2="812" y2="950" stroke="#aaa" stroke-width="3"/>
  <text class="label" x="1020" y="932">tms_transaction</text>
  <text class="sub" x="1020" y="968">lock DO; reject tetap request</text>

  <path class="seq" d="M500 936 V1004"/>
  <text class="flab" x="548" y="978">OTW ambil</text>

  <!-- ===== 6 QR Muat / Bongkar ===== -->
  <rect class="ent" x="32" y="1028" width="168" height="48" rx="4"/>
  <text class="label" x="116" y="1057">Pengawas</text>
  <path class="flow" d="M200 1052 H370"/>
  <text class="flab" x="285" y="1042">scan gedung / pengawas</text>

  <rect class="ent" x="32" y="1092" width="168" height="48" rx="4"/>
  <text class="label" x="116" y="1121">Driver</text>
  <path class="flow" d="M200 1116 H370"/>
  <text class="flab" x="285" y="1106">mulai / selesai</text>

  <ellipse class="proc" cx="500" cy="1084" rx="128" ry="44"/>
  <text class="label" x="500" y="1078">6 QR Muat / Bongkar</text>
  <text class="sub" x="500" y="1096">dual-party scan</text>

  <path class="flow" d="M628 1084 H800"/>
  <rect class="store" x="800" y="1058" width="440" height="52"/>
  <line x1="812" y1="1058" x2="812" y2="1110" stroke="#aaa" stroke-width="3"/>
  <text class="label" x="1020" y="1080">tms_transaction</text>
  <text class="sub" x="1020" y="1096">muat / bongkar + durasi</text>

  <path class="seq" d="M500 1128 V1212"/>
  <text class="flab" x="548" y="1178">track trip</text>

  <!-- ===== 7 Maps / Notif ===== -->
  <rect class="ent" x="32" y="1266" width="168" height="56" rx="4"/>
  <text class="label" x="116" y="1288">Operator</text>
  <text class="sub" x="116" y="1306">maps / monitoring</text>
  <path class="flow" d="M200 1294 H370"/>
  <text class="flab" x="285" y="1284">posisi truk</text>

  <ellipse class="proc" cx="500" cy="1294" rx="128" ry="40"/>
  <text class="label" x="500" y="1288">7 Maps / Notif</text>
  <text class="sub" x="500" y="1306">Leaflet + WebSocket</text>

  <path class="flow" d="M628 1294 H800"/>
  <rect class="store" x="800" y="1268" width="440" height="52"/>
  <line x1="812" y1="1268" x2="812" y2="1320" stroke="#aaa" stroke-width="3"/>
  <text class="label" x="1020" y="1290">tms_transaction</text>
  <text class="sub" x="1020" y="1306">posisi + Telegram</text>

  <path class="seq" d="M500 1334 V1400"/>
  <text class="flab" x="555" y="1374">kedatangan</text>

  <!-- ===== 8 Confirm / Komplain ===== -->
  <rect class="ent" x="32" y="1424" width="168" height="48" rx="4"/>
  <text class="label" x="116" y="1453">Produksi</text>
  <path class="flow" d="M200 1448 H370"/>
  <text class="flab" x="285" y="1438">confirm / komplain</text>

  <rect class="ent" x="32" y="1488" width="168" height="48" rx="4"/>
  <text class="label" x="116" y="1517">Admin WSM</text>
  <path class="flow" d="M200 1512 H370"/>
  <text class="flab" x="285" y="1502">approve + NTI / BAK</text>

  <ellipse class="proc" cx="500" cy="1480" rx="128" ry="44"/>
  <text class="label" x="500" y="1474">8 Confirm / Komplain</text>
  <text class="sub" x="500" y="1492">foto max 2, NTI, BAK</text>

  <path class="flow" d="M628 1480 H800"/>
  <rect class="store" x="800" y="1454" width="440" height="52"/>
  <line x1="812" y1="1454" x2="812" y2="1506" stroke="#aaa" stroke-width="3"/>
  <text class="label" x="1020" y="1476">tms_transaction</text>
  <text class="sub" x="1020" y="1492">close / material balik staging</text>

  <!-- legend -->
  <rect class="ent" x="32" y="1628" width="24" height="18" rx="2"/>
  <text class="sub" x="132" y="1642">external entity</text>
  <ellipse class="proc" cx="280" cy="1637" rx="18" ry="12"/>
  <text class="sub" x="360" y="1642">process</text>
  <rect class="store" x="430" y="1628" width="36" height="18"/>
  <line x1="436" y1="1628" x2="436" y2="1646" stroke="#aaa" stroke-width="2"/>
  <text class="sub" x="530" y="1642">data store</text>
  <path class="seq" d="M640 1637 H700"/>
  <text class="sub" x="800" y="1642">ungu = urutan proses</text>
  <text class="sub" x="1060" y="1642">Store diulang biar panah pendek</text>

  <text class="sub" x="640" y="1688">Race-accept lock SJ ke DO. Reject tidak ganti store: status tetap request sampai driver lain ambil.</text>
</svg>
