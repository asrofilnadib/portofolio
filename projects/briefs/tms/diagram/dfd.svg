<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1500" width="100%" role="img" aria-label="DFD Level 1 TMS Gane-Sarson">
  <defs>
    <marker id="tms-gs-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e6e6e6"/>
    </marker>
  </defs>
  <style>
    .ent { fill: #2c3340; stroke: #e6e6e6; stroke-width: 1.6; }
    .proc { fill: #3a4556; stroke: #e6e6e6; stroke-width: 1.8; }
    .store-line { stroke: #e6e6e6; stroke-width: 1.4; fill: none; }
    .elab { fill: #f0f0f0; font-family: Georgia, "Times New Roman", serif; font-size: 13px; text-anchor: middle; }
    .pnum { fill: #f0f0f0; font-family: Georgia, "Times New Roman", serif; font-size: 13px; text-anchor: middle; }
    .plab { fill: #f0f0f0; font-family: Georgia, "Times New Roman", serif; font-size: 11px; text-anchor: middle; }
    .slab { fill: #f0f0f0; font-family: Georgia, "Times New Roman", serif; font-size: 12px; text-anchor: middle; }
    .flab { fill: #cfcfcf; font-family: Georgia, "Times New Roman", serif; font-size: 11px; }
    .title { fill: #f0f0f0; font-family: Georgia, "Times New Roman", serif; font-size: 15px; text-anchor: middle; }
    .flow { stroke: #e6e6e6; stroke-width: 1.2; fill: none; marker-end: url(#tms-gs-arrow); }
    .wire { stroke: #e6e6e6; stroke-width: 1.2; fill: none; }
  </style>

  <text class="title" x="480" y="24">DFD Level 1 — TMS Transportation</text>

  <!-- entities -->
  <rect class="ent" x="20" y="40" width="130" height="36"/>
  <text class="elab" x="85" y="63">SAP</text>

  <rect class="ent" x="20" y="88" width="130" height="36"/>
  <text class="elab" x="85" y="111">Produksi</text>

  <rect class="ent" x="780" y="230" width="150" height="40"/>
  <text class="elab" x="855" y="255">Admin WSM</text>

  <rect class="ent" x="20" y="412" width="130" height="36"/>
  <text class="elab" x="85" y="435">Staging</text>

  <rect class="ent" x="20" y="582" width="130" height="36"/>
  <text class="elab" x="85" y="605">Pengawas</text>

  <rect class="ent" x="780" y="752" width="150" height="40"/>
  <text class="elab" x="855" y="777">Driver</text>

  <rect class="ent" x="780" y="1092" width="150" height="48"/>
  <text class="elab" x="855" y="1114">Operator</text>
  <text class="plab" x="855" y="1130">maps / monitoring</text>

  <!-- processes -->
  <circle class="proc" cx="300" cy="100" r="54"/>
  <text class="pnum" x="300" y="88">1.0</text>
  <text class="plab" x="300" y="106">Upload</text>
  <text class="plab" x="300" y="120">Reservasi</text>

  <circle class="proc" cx="300" cy="270" r="54"/>
  <text class="pnum" x="300" y="258">2.0</text>
  <text class="plab" x="300" y="276">Picking WSM</text>
  <text class="plab" x="300" y="290">MID + palet</text>

  <circle class="proc" cx="300" cy="440" r="54"/>
  <text class="pnum" x="300" y="428">3.0</text>
  <text class="plab" x="300" y="446">Staging</text>
  <text class="plab" x="300" y="460">Confirm</text>

  <circle class="proc" cx="300" cy="610" r="54"/>
  <text class="pnum" x="300" y="598">4.0</text>
  <text class="plab" x="300" y="616">Draft / Request</text>
  <text class="plab" x="300" y="630">SJ max 12 palet</text>

  <circle class="proc" cx="300" cy="780" r="54"/>
  <text class="pnum" x="300" y="768">5.0</text>
  <text class="plab" x="300" y="786">Race Accept</text>
  <text class="plab" x="300" y="800">SJ jadi DO</text>

  <circle class="proc" cx="300" cy="950" r="54"/>
  <text class="pnum" x="300" y="938">6.0</text>
  <text class="plab" x="300" y="956">QR Muat /</text>
  <text class="plab" x="300" y="970">Bongkar</text>

  <circle class="proc" cx="300" cy="1120" r="54"/>
  <text class="pnum" x="300" y="1108">7.0</text>
  <text class="plab" x="300" y="1126">Maps / Notif</text>
  <text class="plab" x="300" y="1140">Leaflet WS</text>

  <circle class="proc" cx="300" cy="1290" r="54"/>
  <text class="pnum" x="300" y="1278">8.0</text>
  <text class="plab" x="300" y="1296">Confirm /</text>
  <text class="plab" x="300" y="1310">Komplain</text>

  <!-- stores -->
  <line class="store-line" x1="520" y1="80" x2="750" y2="80"/>
  <line class="store-line" x1="520" y1="108" x2="750" y2="108"/>
  <text class="slab" x="635" y="100">tms_material_reservasi</text>

  <line class="store-line" x1="520" y1="248" x2="750" y2="248"/>
  <line class="store-line" x1="520" y1="276" x2="750" y2="276"/>
  <text class="slab" x="635" y="268">tms_material_reservasi_wsm</text>

  <line class="store-line" x1="520" y1="298" x2="750" y2="298"/>
  <line class="store-line" x1="520" y1="326" x2="750" y2="326"/>
  <text class="slab" x="635" y="318">tms_master_konversi_palet</text>

  <line class="store-line" x1="520" y1="418" x2="750" y2="418"/>
  <line class="store-line" x1="520" y1="446" x2="750" y2="446"/>
  <text class="slab" x="635" y="438">merge tables</text>

  <line class="store-line" x1="520" y1="760" x2="750" y2="760"/>
  <line class="store-line" x1="520" y1="788" x2="750" y2="788"/>
  <text class="slab" x="635" y="780">tms_transaction</text>

  <line class="store-line" x1="520" y1="820" x2="750" y2="820"/>
  <line class="store-line" x1="520" y1="848" x2="750" y2="848"/>
  <text class="slab" x="635" y="840">tms_driver / tms_car</text>

  <!-- SAP + Produksi to 1.0 -->
  <path class="flow" d="M150 58 H200 V90 H246"/>
  <text class="flab" x="154" y="50">Excel RSV</text>
  <path class="flow" d="M150 106 H220 V110 H246"/>
  <text class="flab" x="154" y="128">upload file</text>

  <!-- 1.0 to reservasi -->
  <path class="flow" d="M354 100 H520"/>
  <text class="flab" x="380" y="92">RSV</text>

  <!-- 1.0 to 2.0 -->
  <path class="flow" d="M300 154 V216"/>
  <text class="flab" x="308" y="190">no_reservasi</text>

  <!-- Admin WSM to 2.0 -->
  <path class="flow" d="M780 250 H700 V270 H354"/>
  <text class="flab" x="710" y="242">picking list</text>

  <!-- 2.0 to stores -->
  <path class="flow" d="M354 262 H520"/>
  <text class="flab" x="380" y="254">picking / MID</text>
  <path class="flow" d="M354 282 H480 V312 H520"/>
  <text class="flab" x="380" y="300">konversi palet</text>

  <!-- 2.0 to 3.0 -->
  <path class="flow" d="M300 324 V386"/>
  <text class="flab" x="308" y="360">dokumen WSM</text>

  <!-- Staging to 3.0 -->
  <path class="flow" d="M150 430 H246"/>
  <text class="flab" x="154" y="422">checklist</text>

  <!-- 3.0 to merge -->
  <path class="flow" d="M354 440 H520"/>
  <text class="flab" x="380" y="432">material aktif</text>

  <!-- 3.0 to 4.0 -->
  <path class="flow" d="M300 494 V556"/>
  <text class="flab" x="308" y="530">siap request</text>

  <!-- Pengawas to 4.0 (and later 6.0 via left bus) -->
  <path class="flow" d="M150 600 H246"/>
  <text class="flab" x="154" y="592">draft SJ</text>

  <!-- 4.0 to transaction bus -->
  <path class="wire" d="M354 610 H490"/>
  <text class="flab" x="360" y="600">SJ request</text>

  <!-- 4.0 to 5.0 -->
  <path class="flow" d="M300 664 V726"/>
  <text class="flab" x="308" y="700">broadcast</text>

  <!-- Driver to 5.0 -->
  <path class="flow" d="M780 772 H700 V780 H354"/>
  <text class="flab" x="710" y="764">accept / reject</text>

  <!-- 5.0 to driver store + transaction -->
  <path class="flow" d="M354 790 H480 V834 H520"/>
  <text class="flab" x="360" y="812">QR gedung aktif</text>
  <path class="flow" d="M354 770 H520"/>
  <text class="flab" x="400" y="762">lock DO</text>

  <!-- 5.0 to 6.0 -->
  <path class="flow" d="M300 834 V896"/>
  <text class="flab" x="308" y="870">on_proses</text>

  <!-- Pengawas to 6.0 (gap between entity and process) -->
  <path class="flow" d="M150 618 H175 V950 H246"/>
  <text class="flab" x="24" y="790">scan muat / bongkar</text>

  <!-- Driver to 6.0 (inner right) -->
  <path class="flow" d="M780 792 H760 V950 H354"/>
  <text class="flab" x="764" y="880">mulai / selesai</text>

  <!-- 6.0 to transaction bus -->
  <path class="wire" d="M354 950 H490"/>
  <text class="flab" x="360" y="940">durasi muat/bongkar</text>

  <!-- 6.0 to 7.0 -->
  <path class="flow" d="M300 1004 V1066"/>
  <text class="flab" x="308" y="1040">posisi trip</text>

  <!-- Operator to 7.0 -->
  <path class="flow" d="M780 1116 H700 V1120 H354"/>
  <text class="flab" x="710" y="1108">track truk</text>

  <!-- 7.0 to transaction bus -->
  <path class="wire" d="M354 1120 H490"/>
  <text class="flab" x="400" y="1110">Telegram + maps</text>

  <!-- 7.0 to 8.0 -->
  <path class="flow" d="M300 1174 V1236"/>
  <text class="flab" x="308" y="1210">kedatangan</text>

  <!-- Produksi to 8.0 (outer left, like contoh) -->
  <path class="flow" d="M20 124 H8 V1290 H246"/>
  <text class="flab" x="12" y="1260">confirm / komplain</text>

  <!-- Admin WSM to 8.0 (outer right) -->
  <path class="flow" d="M930 250 H980 V1290 H354"/>
  <text class="flab" x="888" y="1272">approve NTI / BAK</text>

  <!-- shared tms_transaction bus -->
  <path class="wire" d="M490 610 V1290"/>
  <path class="wire" d="M354 1290 H490"/>
  <path class="flow" d="M490 774 H520"/>
  <text class="flab" x="360" y="1280">close / balik staging</text>
</svg>
